apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Release-status API resources in the platform namespace
  sourceRepos:
    - https://github.com/Vishnu063/devops_platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform
  # Namespace creation is an administrator bootstrap operation.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
    - group: autoscaling
      kind: HorizontalPodAutoscaler
