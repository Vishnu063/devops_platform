{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "Set ingress.className" .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ required "Set ingress.host" .Values.ingress.host | quote }}
      secretName: {{ required "Set ingress.tlsSecretName to an existing TLS secret" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Metrics and health endpoints remain internal.
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
{{- end }}
