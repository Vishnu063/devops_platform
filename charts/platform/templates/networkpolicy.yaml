{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  # The API has no outbound dependencies.
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.ingress.enabled }}
    {{- if not .Values.ingress.controllerPodLabels }}
    {{- fail "Set ingress.controllerPodLabels to match your ingress controller" }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "Set ingress.controllerNamespace" .Values.ingress.controllerNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.ingress.controllerPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
