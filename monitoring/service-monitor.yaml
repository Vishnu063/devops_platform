# Requires Prometheus Operator and namespace/label selectors matching this stack.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform
  namespace: platform
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform
  namespace: platform
  labels:
    release: monitoring
spec:
  groups:
    - name: platform
      rules:
        - alert: PlatformTargetDown
          expr: up{namespace="platform",service="platform"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: A platform metrics target is unreachable
        - alert: PlatformTargetsMissing
          expr: absent(up{namespace="platform",service="platform"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Prometheus has no platform targets
        - alert: PlatformHighErrorRate
          expr: |
            sum(rate(platform_http_requests_total{namespace="platform",status=~"5.."}[5m]))
            / clamp_min(sum(rate(platform_http_requests_total{namespace="platform"}[5m])), 0.001) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Platform HTTP 5xx rate is above one percent
        - alert: PlatformHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(platform_http_request_duration_seconds_bucket{namespace="platform",route="/"}[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Platform p95 latency is above 500 milliseconds
