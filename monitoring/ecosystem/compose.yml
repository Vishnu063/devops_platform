# Linux-only optional monitoring; every component requires an explicit profile.
services:
  prometheus:
    image: prom/prometheus:v3.7.0
    profiles: [monitoring]
    network_mode: host
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.listen-address=127.0.0.1:19090, --storage.tsdb.retention.time=24h, --storage.tsdb.path=/prometheus]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${OPS_PILOT_READ_TOKEN_FILE:?Configure private read token file}:/run/keys/read:ro
      - ecosystem_prometheus:/prometheus
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100
    security_opt: [no-new-privileges:true]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    network_mode: host
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --web.listen-address=127.0.0.1:19093, --cluster.listen-address=, --storage.path=/alertmanager]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${OPS_PILOT_ALERT_TOKEN_FILE:?Configure private alert token file}:/run/keys/alert:ro
      - ecosystem_alertmanager:/alertmanager
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 60
    security_opt: [no-new-privileges:true]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    profiles: [monitoring]
    network_mode: host
    command: [--config.file=/etc/blackbox.yml, --web.listen-address=127.0.0.1:19115]
    volumes: [./blackbox.yml:/etc/blackbox.yml:ro]
    mem_limit: 48m
    cpus: 0.25
    pids_limit: 60
    security_opt: [no-new-privileges:true]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [ui]
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '13000'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a private Grafana password}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/ecosystem.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/ecosystem.yml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/ecosystem.json:ro
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    security_opt: [no-new-privileges:true]
volumes:
  ecosystem_prometheus:
  ecosystem_alertmanager:
