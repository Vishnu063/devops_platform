# Render the uppercase placeholders into a private lab directory. Host processes
# intentionally use loopback; no host-networked container or public receiver.
global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [RULES_FILE]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:ALERTMANAGER_PORT"]
scrape_configs:
  - job_name: cloudlaunch-ecosystem
    static_configs:
      - targets: ["127.0.0.1:APP_PORT"]
        labels: {service: "SERVICE_NAME"}
  - job_name: ops-pilot
    authorization:
      credentials_file: TOKEN_FILE
    static_configs:
      - targets: ["127.0.0.1:PILOT_PORT"]
