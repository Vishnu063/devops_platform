global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:19093']
scrape_configs:
  - job_name: ecosystem-app
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://127.0.0.1:18080/']
        labels:
          service: ecosystem-demo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:19115'
  - job_name: ops-pilot
    static_configs:
      - targets: ['127.0.0.1:8767']
    authorization:
      type: Bearer
      credentials_file: /run/keys/read
  # Reuse existing exporters when present; this profile does not mount the host or Docker socket.
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:8081']
