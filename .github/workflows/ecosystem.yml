name: Optional ecosystem sources
on:
  push:
    branches: [feat/unified-devops-engineer]
  pull_request:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_ecosystem_sources.py -v
      - run: python -m compileall -q liveflow
