name: CI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Run all gates and publish a signed release candidate from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash ci/check-source.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-reports
          path: |
            coverage.xml
            reports/rendered*.yaml
          retention-days: 7
  image:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash ci/build-image.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-image
          path: |
            platform-image.tar
            reports/image-archive.sha256
            reports/image-id.txt
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 7
  quality:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: image
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [image, quality]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: security-reports
          path: reports
      - name: Verify and load the scanned candidate
        env:
          IMAGE: ghcr.io/vishnu063/devops_platform:${{ github.sha }}
        run: |
          sha256sum --check reports/image-archive.sha256
          docker load -i platform-image.tar
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$(cat reports/image-id.txt)"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.5.2
      - name: Push and sign exact image digest
        env:
          IMAGE: ghcr.io/vishnu063/devops_platform:${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker push "$IMAGE"
          DIGEST_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          test -n "$DIGEST_REF"
          printf '%s\n' "$DIGEST_REF" > reports/release-image.txt
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type cyclonedx --predicate reports/sbom.json "$DIGEST_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence
          path: reports/
          retention-days: 30
